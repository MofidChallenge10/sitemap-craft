<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc"><title id="title">Sitemap Craft — visual mark</title><desc id="desc">Original animated illustration for sitemap-craft; motion is decorative and respects reduced-motion preferences.</desc><defs><linearGradient id="wash" x1="0" x2="1"><stop stop-color="#B7E4C7"/><stop offset="1" stop-color="#12372A"/></linearGradient></defs><style>.float{transform-box:fill-box;transform-origin:center;animation:float 4.8s ease-in-out infinite}.dash{animation:dash 7s linear infinite}@keyframes float{50%{transform:translateY(-8px)}}@keyframes dash{to{stroke-dashoffset:-72}}@media(prefers-reduced-motion:reduce){.float,.dash{animation:none}}</style><rect width="900" height="280" rx="22" fill="#12372A"/><path d="M0 220C170 160 250 300 420 210S700 150 900 205V280H0Z" fill="url(#wash)" opacity=".22"/><g><path d="M580 190V100L680 52L780 100V190" fill="none" stroke="#B7E4C7" stroke-width="4" stroke-linejoin="round"/><path d="M620 190V126H740V190M650 126V190M710 126V190" fill="none" stroke="#FFD166" stroke-width="4"/><circle cx="680" cy="52" r="9" fill="#FFD166"/><path d="M520 220H820" stroke="#B7E4C7" stroke-width="3" stroke-dasharray="6 9" class="dash"/><g class="float"><circle cx="800" cy="55" r="6" fill="#B7E4C7"/></g></g><text x="64" y="104" fill="#F8FAFC" font-family="ui-monospace,monospace" font-size="15" letter-spacing="2">SITEMAP-CRAFT</text><text x="64" y="145" fill="#F8FAFC" font-family="Georgia,serif" font-size="31">Sitemap Craft</text><text x="64" y="178" fill="#FFD166" font-family="Arial,sans-serif" font-size="14">Small tool. Clear signal.</text></svg>